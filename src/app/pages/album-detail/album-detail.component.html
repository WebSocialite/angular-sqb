<div class="album-detail">
  <div class="container">
    <button class="back-btn" (click)="goBack()">← Back</button>

    <div *ngIf="isLoading" class="loading">Loading...</div>

    <div *ngIf="!isLoading && album" class="album-content">
      <h2>Album Details</h2>
      <h3>{{ album.userId }}</h3>
      <p>{{ album.title }}</p>
    </div>

    <div *ngIf="!isLoading && !album" class="error">
      <p>Error loading album. Please try again.</p>
    </div>
  </div>
</div>
