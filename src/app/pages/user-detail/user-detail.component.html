<div class="user-detail">
  <div class="container">
    <button class="back-btn" (click)="goBack()">← Back</button>

    <div *ngIf="isLoading" class="loading">Loading...</div>

    <div *ngIf="!isLoading && user" class="user-content">
      <h2>User Details</h2>
      <h3>{{ user.name }}</h3>
      <p>{{ user.email }}</p>
      <p>{{ user.website }}</p>
      <p>{{ user.id }}</p>
    </div>

    <div *ngIf="!isLoading && !user" class="error">
      <p>Error loading user. Please try again.</p>
    </div>
  </div>
</div>
